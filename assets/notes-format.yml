# Options for the tagged-PDF lecture-notes build (Makefile target `notes`).
# Kept out of the decks' own front matter so the site build is untouched.
format:
  latex:
    documentclass: article
    geometry: margin=1in
    fontsize: 11pt
    template-partials:
      - ../../assets/passoptions.latex
filters:
  - ../../assets/latex-notes.lua
