<script>
// Reflow (WCAG 1.4.10) + keyboard access (2.1.1) for equations.
// A display equation gets overflow-x:auto in styles.css. Long *inline*
// equations can also poke past a narrow viewport; those get the same
// treatment here, but only the actual offenders -- overflow on an
// inline-block shifts its baseline, so a blanket rule would misalign
// every inline equation on the site. Scrollable equations get a tab stop
// so keyboard users can reach and scroll them.
(function () {
  function fix() {
    var vw = document.documentElement.clientWidth;
    document.querySelectorAll('mjx-container').forEach(function (m) {
      var r = m.getBoundingClientRect();
      // Two ways an equation breaks reflow: it pokes past the viewport, or it
      // is wider than the box it sits in (a per-part solution toggle, a table
      // cell) and stretches that box until the *page* scrolls sideways.
      var box = m.parentElement ? m.parentElement.clientWidth : vw;
      if (r.right > vw + 1 || r.width > box + 1) m.classList.add('mjx-scroll');
      if (m.scrollWidth > m.clientWidth + 1) {
        m.setAttribute('tabindex', '0');
        m.setAttribute('role', 'group');
        m.setAttribute('aria-label', 'Scrollable equation');
      }
    });
  }
  window.addEventListener('load', fix);
  document.addEventListener('toggle', function (e) {
    if (e.target.tagName === 'DETAILS') fix();
  }, true);
  var t; window.addEventListener('resize', function () {
    clearTimeout(t); t = setTimeout(fix, 250);
  });
})();
</script>
