format:
  revealjs:
    embed-resources: true
    include-after-body: ../../assets/slides-a11y.html
    footer: "ECON 441 · Introduction to Mathematical Economics"
    pdf-separate-fragments: false
    navigation-mode: linear
    hash-type: number
    slide-number: true
    controls: true
    progress: true
    transition: fade
    transition-speed: fast
    center: false
    code-overflow: wrap
    highlight-style: a11y-light
    chalkboard: false
    mathjax: true
    mathjax-config:
      output:
        font: mathjax-tex
      tex:
        packages: {'[+]': ['ams']}
