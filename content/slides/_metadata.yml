format:
  revealjs:
    embed-resources: true
    # Same canvas as the ECON 201 decks: 16:9 at 1280x720 with a moderate margin.
    width: 1280
    height: 720
    margin: 0.08
    include-after-body: ../../assets/slides-a11y.html
    footer: "ECON 441 · Introduction to Mathematical Economics"
    pdf-separate-fragments: false
    navigation-mode: linear
    hash-type: number
    slide-number: true
    controls: true
    progress: true
    transition: fade
    transition-speed: fast
    center: false
    code-overflow: wrap
    highlight-style: a11y-light
    chalkboard: false
    mathjax: true
    # Same self-hosted engine as the site pages (v3); the plugin's default
    # is MathJax v2 from cdn.jsdelivr.net, which dies on filtered networks.
    html-math-method:
      method: mathjax
      url: "https://dbhagia.com/econ441/assets/mathjax/tex-chtml-full.js"
    mathjax-config:
      output:
        font: mathjax-tex
      tex:
        packages: {'[+]': ['ams']}
